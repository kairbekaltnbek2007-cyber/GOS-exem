<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГОС экзамен</title>
<style>
:root{--b:#2f6bff;--bg:#f3f7ff;--t:#16233b;--m:#6b7a93;--l:#e1e8f5}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;min-height:100vh}aside{width:230px;background:#fff;border-right:1px solid var(--l);padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-size:17px;margin-bottom:14px}nav{display:flex;flex-direction:column;gap:4px;flex:1}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--t);text-decoration:none;cursor:pointer}aside a.on{background:#e4edff;color:var(--b);font-weight:600}em{font-style:normal}
main{flex:1;padding:24px;max-width:1100px;min-width:0}h1{font-size:24px;margin:0 0 14px}h2{font-size:18px;margin:20px 0 10px}h3{margin:6px 0 14px}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}small{display:block;color:var(--m);margin-top:3px}.mut{color:var(--m)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:26px;margin-top:4px}.g{color:#16a34a}.r{color:#dc2626}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--l)}.btn:disabled{opacity:.4;cursor:default}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--l);border-radius:10px;font:inherit;margin:4px 0;background:#fff;color:var(--t)}textarea{min-height:70px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.item:last-child{border:0}.item>div{flex:1;min-width:140px}
.pill{background:#e4edff;border-radius:99px;padding:4px 12px;font-weight:600}.pill.big{display:inline-block;margin:3px}.okp{background:#dcfce7;color:#15803d}.wp{background:#fef3c7;color:#b45309}
.drop{display:block;text-align:center;border:2px dashed #9db8f5;padding:40px 16px;cursor:pointer}.drop div{font-size:40px}
.opt{display:flex;gap:8px;align-items:center}.opt input[type=radio]{width:auto}.opt b{width:20px}.q.bad{border-color:#f59e0b;background:#fffbeb}.q.good{border-color:#86efac}.err{color:#dc2626}
.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
.runbox{display:grid;grid-template-columns:200px 1fr;gap:12px;margin-top:12px}.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:start}
.pn{border:1px solid var(--l);background:#fff;border-radius:8px;padding:6px 0;cursor:pointer}.pn.ok{background:#dcfce7}.pn.fl{background:#fde68a}.pn.cur{background:var(--b);color:#fff}
.ans{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:10px;padding:12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--t)}.ans.right{border-color:#16a34a;background:#dcfce7}.ans.wrongo{border-color:#dc2626;background:#fee2e2}.ans:disabled{opacity:1;cursor:default}.ans.sel{border-color:var(--b);background:#e8f0ff}
.auth{max-width:380px;margin:8vh auto;width:100%}.auth a{display:block;margin:10px 0;color:var(--b);cursor:pointer}.av{width:64px;height:64px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:9}.box{max-width:340px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#16233b;color:#fff;padding:10px 16px;border-radius:10px;z-index:10}
@media(max-width:1000px){aside{width:64px;padding:10px}aside em,.logo b{display:none}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){#app{flex-direction:column}aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;z-index:5;border:0;background:#fff;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #1e3a8a14}.logo{display:none}nav{flex-direction:row;justify-content:space-around;gap:0}aside a{flex:1;min-width:0;flex-direction:column;gap:3px;padding:8px 0;border-radius:18px;color:#6b7280;font-size:9.5px;font-weight:500;letter-spacing:-.1px;text-align:center;line-height:1.15}aside a.on{background:#e8f0fe;color:#3b82f6;font-weight:500}aside em{white-space:nowrap}aside a span{display:flex}aside em{display:block}main{padding:14px 12px 80px}.runbox{grid-template-columns:1fr}.pal{grid-template-columns:repeat(8,1fr)}h1{font-size:20px}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="config.js"></script><script src="parser.js"></script><script src="app.js"></script>
</body></html>
